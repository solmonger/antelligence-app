[project]
name = "antelligence"
version = "0.2.0"
description = "DeSci compute-as-a-service: privacy-preserving tumor simulation with ZK proofs on Base L2"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "openai",
  "numpy",
  "python-dotenv",
  "pandas",
  "web3",
  "google-generativeai",
  "mistralai",
  "httpx",
  "scipy",
  "nibabel",
  "scikit-image",
  "pydantic",
  "matplotlib",
  "cryptography>=46.0.7",
  "monai>=1.6.1",
  "torch>=2.14.1",
  "pyyaml>=6.0.3",
  "opentimestamps>=0.4.5",
]

[project.optional-dependencies]
test = [
  "pytest>=9",
  "tokenizers>=0.23.3",
]

[project.scripts]
antelligence = "backend.cli:main"
antelligence-api = "backend.api_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# v4.31: four inherited files run whole episodes on development case BRATS_016 (real data). Tests use the synthetic phantom only, so
# they stay deselected (decision: vault antelligence/v4.31/decisions/2026-10-16-deselect-four-brats016-test-files.md).
addopts = "-v --tb=short --deselect=tests/v4_2/h1/test_drivers.py --deselect=tests/v4_2/t2/test_tune_stage2.py --deselect=tests/v4_2/p1/test_prep_projection.py --deselect=tests/v4_3/a2/test_legacy_golden.py"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "antelligence*"]

[tool.setuptools.package-data]
backend = ["research_fixtures/*.json"]

[tool.uv]
package = true
